{% extends "base.html" %}
{% block title %}ยืมหนังสือ — THE PY-LIB{% endblock %}
{% block page_title %}ยืมหนังสือ{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>ยืมหนังสือ</h3>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label>เลือกสมาชิก</label>
                <select name="member_id" required>
                    <option value="">— เลือกสมาชิก —</option>
                    {% for m in members %}
                    <option value="{{ m.id }}">{{ m.name }} ({{ m.grade }} / {{ m.number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>เลือกหนังสือ (ว่างเท่านั้น)</label>
                <select name="book_id" required>
                    <option value="">— เลือกหนังสือ —</option>
                    {% for b in books %}
                    <option value="{{ b.id }}">{{ b.code }} — {{ b.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>กำหนดคืน</label>
                <input type="date" name="due_date" value="{{ default_due }}" required>
            </div>
            <div class="form-group form-actions">
                <button type="submit" class="btn btn-success">ยืมหนังสือ</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
