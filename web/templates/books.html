{% extends "base.html" %}
{% block title %}หนังสือ — THE PY-LIB{% endblock %}
{% block page_title %}จัดการหนังสือ{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3><svg width="18" height="18" class="icon-inline"><use href="#icon-plus"/></svg> เพิ่มหนังสือใหม่</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('book_add') }}" class="form-inline">
            {{ csrf_field }}
            <div class="form-group">
                <label>รหัสหนังสือ</label>
                <input type="text" name="code" placeholder="T-001" required>
            </div>
            <div class="form-group">
                <label>ชื่อหนังสือ</label>
                <input type="text" name="title" placeholder="ชื่อหนังสือ" required>
            </div>
            <button type="submit" class="btn btn-success">
                <svg width="16" height="16" class="icon-inline"><use href="#icon-plus"/></svg> เพิ่มหนังสือ
            </button>
        </form>
    </div>
</div>
<div class="card">
    <div class="card-header">
        <h3>หนังสือทั้งหมด ({{ books|length }} เล่ม)</h3>
        <form class="table-filter" action="{{ url_for('books') }}"
              hx-get="{{ url_for('books') }}"
              hx-target="#booksTableWrap" hx-swap="outerHTML"
              hx-trigger="input changed delay:300ms from:input[name=q], change from:select[name=status]"
              hx-indicator="#booksTableWrap">
            <div class="search-box">
                <svg width="16" height="16" class="search-icon"><use href="#icon-search"/></svg>
                <input type="text" name="q" value="{{ q }}" placeholder="ค้นหา รหัส/ชื่อ...">
            </div>
            <select name="status" class="status-filter" aria-label="กรองตามสถานะ">
                <option value="">ทุกสถานะ</option>
                <option value="ว่าง" {% if status == 'ว่าง' %}selected{% endif %}>ว่าง</option>
                <option value="ยืมแล้ว" {% if status == 'ยืมแล้ว' %}selected{% endif %}>ยืมแล้ว</option>
                <option value="หยุดให้บริการ" {% if status == 'หยุดให้บริการ' %}selected{% endif %}>หยุดให้บริการ</option>
            </select>
            <noscript><button type="submit" class="btn btn-ghost btn-sm">ค้นหา</button></noscript>
        </form>
    </div>
    <div class="card-body">
        {% include 'partials/_books_table.html' %}
    </div>
</div>
{% endblock %}
