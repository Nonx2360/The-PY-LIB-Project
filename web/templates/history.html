{% extends "base.html" %}
{% block title %}ประวัติยืม-คืน — THE PY-LIB{% endblock %}
{% block page_title %}ประวัติยืม-คืน{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3><svg width="18" height="18" class="icon-inline"><use href="#icon-history"/></svg> ประวัติการยืม-คืน</h3>
        <form class="table-filter" action="{{ url_for('history') }}"
              hx-get="{{ url_for('history') }}"
              hx-target="#historyTableWrap" hx-swap="outerHTML"
              hx-trigger="input changed delay:300ms from:input[name=q]"
              hx-indicator="#historyTableWrap">
            <div class="search-box">
                <svg width="16" height="16" class="search-icon"><use href="#icon-search"/></svg>
                <input type="text" name="q" value="{{ q }}" placeholder="ค้นหา ชื่อ/รหัส/ชื่อหนังสือ...">
            </div>
            <noscript><button type="submit" class="btn btn-ghost btn-sm">ค้นหา</button></noscript>
        </form>
    </div>
    <div class="card-body">
        {% include 'partials/_history_table.html' %}
    </div>
</div>
{% endblock %}
