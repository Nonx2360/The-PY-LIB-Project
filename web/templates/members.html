{% extends "base.html" %}
{% block title %}สมาชิก — THE PY-LIB{% endblock %}
{% block page_title %}จัดการสมาชิก{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3><svg width="18" height="18" class="icon-inline"><use href="#icon-plus"/></svg> เพิ่มสมาชิกใหม่</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('member_add') }}" class="form-inline">
            {{ csrf_field }}
            <div class="form-group">
                <label>ชื่อ-สกุล</label>
                <input type="text" name="name" placeholder="ชื่อ นามสกุล" required>
            </div>
            <div class="form-group">
                <label>ชั้น/ห้อง</label>
                <input type="text" name="grade" placeholder="ม.4/1" required>
            </div>
            <div class="form-group">
                <label>หมายเลข</label>
                <input type="text" name="number" placeholder="12345" required>
            </div>
            <button type="submit" class="btn btn-success">
                <svg width="16" height="16" class="icon-inline"><use href="#icon-plus"/></svg> เพิ่มสมาชิก
            </button>
        </form>
    </div>
</div>
<div class="card">
    <div class="card-header">
        <h3>รายชื่อสมาชิก ({{ members|length }} คน)</h3>
        <form class="table-filter" action="{{ url_for('members') }}"
              hx-get="{{ url_for('members') }}"
              hx-target="#membersTableWrap" hx-swap="outerHTML"
              hx-trigger="input changed delay:300ms from:input[name=q]"
              hx-indicator="#membersTableWrap">
            <div class="search-box">
                <svg width="16" height="16" class="search-icon"><use href="#icon-search"/></svg>
                <input type="text" name="q" value="{{ q }}" placeholder="ค้นหา ชื่อ/ชั้น/หมายเลข...">
            </div>
            <noscript><button type="submit" class="btn btn-ghost btn-sm">ค้นหา</button></noscript>
        </form>
    </div>
    <div class="card-body">
        {% include 'partials/_members_table.html' %}
    </div>
</div>
{% endblock %}
